name: Set up Node.js
description: Install the pinned Node.js, restore the npm cache, and run npm ci
inputs:
  registry-url:
    description: npm registry to configure for publishing
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
        registry-url: ${{ inputs.registry-url }}
    - run: npm ci
      shell: bash
