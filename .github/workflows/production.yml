name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.repository == 'JuliaPackageFactory/PkgFactory.ts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pkgfactory.ohnolab.workers.dev
    concurrency:
      group: pkgfactory-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify main was deployed to staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-revision.ts
      - run: npm ci
      - run: npm run check
      - name: Deploy production
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://pkgfactory.ohnolab.workers.dev/health \
            | jq --exit-status '.service == "PkgFactory" and (.status == "ok" or .status == "maintenance")'
