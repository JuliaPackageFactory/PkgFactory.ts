name: Template repositories E2E
on:
  push:
    branches: [main]
    paths:
      - 'packages/pkgfactory/templates/**'
      - 'packages/pkgfactory/src/core/**'
      - 'scripts/e2e/**'
      - 'scripts/template-repositories.ts'
      - 'test/e2e-*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/template-repositories.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkgfactory-template-repositories
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'JuliaPackageFactory/PkgFactory.ts' && github.ref == 'refs/heads/main' && vars.PKGFACTORY_TEMPLATE_E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: [ExampleMinimum, ExampleSimple, ExampleAllInOne]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Render current template sources
        run: node scripts/templates.mjs
      - name: Check committed template bundle
        run: git diff --exit-code -- packages/pkgfactory/src/core/templates.json
      - name: Update existing repository and verify history
        id: snapshot
        env:
          PKGFACTORY_E2E_TOKEN: ${{ secrets.PKGFACTORY_E2E_TOKEN }}
        run: npm run e2e:templates -- --package=${{ matrix.package }} --publish
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Test the published Julia package without the publishing token
        env:
          JET_TEST: 'true'
        working-directory: ${{ steps.snapshot.outputs.package_path }}
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Build documentation without deployment credentials
        if: matrix.package != 'ExampleMinimum'
        working-directory: ${{ steps.snapshot.outputs.package_path }}
        run: julia --project=docs --startup-file=no -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate(); include("docs/make.jl")'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: template-${{ matrix.package }}
          path: artifacts/template-repositories-${{ matrix.package }}.json
