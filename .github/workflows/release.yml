name: Release (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, npm]
        required: true
      confirmation:
        description: 'Enter publish after reviewing docs/DEPLOYMENT.md and the acceptance report'
        required: true
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'JuliaPackageFactory/PkgFactory.ts' && github.ref == 'refs/heads/main' && inputs.confirmation == 'publish'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    concurrency:
      group: pkgfactory-deploy-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: node scripts/pack-smoke.mjs
      - if: inputs.target == 'npm'
        run: npm publish --workspace @juliapackagefactory/pkgfactory --provenance --access public
      - if: inputs.target == 'staging'
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
