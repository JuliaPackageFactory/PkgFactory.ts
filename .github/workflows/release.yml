name: Release (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production, npm]
        required: true
      confirmation:
        description: 'Enter publish after reviewing docs/DEPLOYMENT.md and the acceptance report'
        required: true
      staging_run_id:
        description: 'For production: CI run ID whose staging deployment you verified (number from /actions/runs/...)'
        type: string
        required: false
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'JuliaPackageFactory/PkgFactory.ts' && github.ref == 'refs/heads/main' && inputs.confirmation == 'publish'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    concurrency:
      group: pkgfactory-deploy-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Resolve verified staging commit
        if: inputs.target == 'production'
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: node scripts/release-revision.ts
      - name: Check out verified staging commit
        if: inputs.target == 'production'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.staging.outputs.sha }}
          persist-credentials: false
      - run: npm ci
      - run: npm run check
      - run: node scripts/pack-smoke.mjs
      - if: inputs.target == 'npm'
        run: npm publish --workspace @juliapackagefactory/pkgfactory --provenance --access public
      - if: inputs.target == 'staging'
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: inputs.target == 'production'
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production health
        if: inputs.target == 'production'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://pkgfactory.ohnolab.workers.dev/health \
            | jq --exit-status '.service == "PkgFactory" and (.status == "ok" or .status == "maintenance")'
