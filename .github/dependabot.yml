# Workflows pin actions to commit SHAs; Dependabot proposes reviewed updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-development:
        dependency-type: "development"
      npm-production:
        dependency-type: "production"
